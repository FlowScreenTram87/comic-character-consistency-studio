[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "comic-character-consistency-studio"
version = "0.6.3"
description = "Desktop studio for generating comics with locked, consistent AI characters."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Comic Consistency Studio contributors" }]
keywords = ["comic", "diffusion", "character-consistency", "sdxl", "flux", "lora"]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "Pillow>=10.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
cuda = ["torch>=2.3", "diffusers>=0.30", "transformers>=4.42", "accelerate>=0.30"]
cpu  = ["torch>=2.3", "diffusers>=0.30", "transformers>=4.42"]
dev  = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
ccs = "comic_consistency.handlers.cli:main"

[project.gui-scripts]
ccs-studio = "comic_consistency.handlers.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/comic_consistency"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]